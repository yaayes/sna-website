# Shared defaults — override per-host in host_vars/<hostname>/vars.yml
php_version: '8.4'
node_version: '22'
postgresql_version: '16'

# Application (shared)
app_name: 'sna'
app_user: 'forge'
app_path: '/home/forge/{{ app_domain }}'
repo_url: 'git@github.com:yaayes/sna-website.git'

# PostgreSQL (shared)
db_user: 'forge'

# Redis (shared)
redis_bind_addresses:
  - '127.0.0.1'
  - '::1'
redis_port: 6379
redis_protected_mode: 'yes'
redis_databases: 16
redis_maxmemory: '256mb'
redis_maxmemory_policy: 'allkeys-lru'

# PHP-FPM socket
php_fpm_socket: '/var/run/php/php{{ php_version }}-fpm.sock'

# PHP extensions (installed as php{{ php_version }}-<name>)
php_extensions:
  - fpm
  - cli
  - pgsql
  - mbstring
  - xml
  - curl
  - zip
  - bcmath
  - intl
  - redis
  - gd
  - tokenizer
  - opcache

# Nginx
# Set to false as a temporary mitigation for CVE-2026-123007 / CVE-2026-123633
# if the nginx repo has not shipped 1.30.7 / 1.31.9 yet.
nginx_http2_enabled: true

# ─── Security patching (roles/server/tasks/security.yml, tag: security) ──────
security_min_php_version: '8.4.28'
security_enforce_min_versions: false # true = fail the play if PHP/Nginx are still unpatched
security_upgrade_postgresql: true # minor upgrades only; restarts PostgreSQL (a few seconds of downtime)
security_full_safe_upgrade: true # also run `apt upgrade` (safe) for everything else
security_extra_packages:
  - openssl
  - libssl3
  - openssh-server
  - sudo
  - nodejs
  - supervisor
security_unattended_upgrades: true
security_unattended_blacklist: [] # e.g. ['postgresql-'] to keep DB upgrades manual
security_automatic_reboot: false
