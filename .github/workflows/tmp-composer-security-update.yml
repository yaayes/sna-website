name: tmp composer security update

on:
  push:
    branches:
      - security/cve-2026-11
    paths:
      - .github/workflows/tmp-composer-security-update.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/cve-2026-11

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: pgsql, mbstring, xml, curl, zip, bcmath, intl, redis, gd

      - name: Composer update (security packages)
        run: |
          composer update laravel/framework league/commonmark phpoffice/phpspreadsheet "symfony/*" mtdowling/jmespath.php aws/aws-sdk-php \
            --with-all-dependencies --no-interaction --no-scripts
          composer show --locked | grep -E '^(laravel/framework|league/commonmark|phpoffice/phpspreadsheet|symfony/http-foundation|symfony/http-kernel|mtdowling/jmespath.php|aws/aws-sdk-php) '
          composer audit --locked

      - name: Commit composer.lock and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/tmp-composer-security-update.yml
          git add composer.lock
          git commit -m "security: composer update for Nov 2026 advisories (laravel, commonmark, phpspreadsheet, symfony)"
          git push origin HEAD:security/cve-2026-11
